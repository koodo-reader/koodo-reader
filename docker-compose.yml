version: "3.8"

services:
  koodo-reader:
    build: .
    container_name: koodo-reader
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    environment:
      - SERVER_USERNAME=${SERVER_USERNAME:-admin}
      - SERVER_PASSWORD=${SERVER_PASSWORD:-securePass123}
      - ENABLE_HTTP_SERVER=false
      # 默认已允许 https://web.koodoreader.com 和 https://web.koodoreader.cn，
      # 这里填的是在默认基础上额外允许的 Origin（例如自建网页版本身）。
      # 示例：ALLOWED_ORIGINS=https://reader.example.com
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    volumes:
      # 使用主机目录（推荐）
      - /opt/uploads:/app/uploads
      # 或者使用命名卷
      # - uploads_data:/app/uploads
# 如果使用命名卷，取消注释以下内容
# volumes:
#   uploads_data:
#     driver: local
